<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZALO WEB TOOL</title>
    <style>
        body { background: #121212; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 20px 10px; margin: 0; }
        .container { background: #1e1e1e; padding: 20px; border-radius: 10px; width: 100%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00b0ff; margin-top: 0; margin-bottom: 20px; font-size: 22px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0 10px 0; background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box; font-family: monospace; }
        textarea { resize: vertical; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-blue { background: #00b0ff; color: white; }
        .btn-green { background: #00e676; color: black; margin-top: 20px; }
        .btn-red { background: #ff5252; color: white; margin-top: 20px; }
        
        .tabs { display: flex; border-bottom: 1px solid #333; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; background: none; border: none; color: #888; padding: 10px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.3s; min-width: 80px;}
        .tab-btn.active { color: #00b0ff; border-bottom: 2px solid #00b0ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .session-box { background: #0a0a0a; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 5px; font-size: 13px;}
        .session-ip { color: #00e676; font-weight: bold; }
        .session-role { color: #ffeb3b; font-weight: bold;}
        .btn-kill { background: #ff5252; color: white; padding: 5px 10px; font-size: 12px; width: auto; margin-top: 5px; border-radius: 3px; }

        .file-upload-wrapper { margin-top: 5px; margin-bottom: 10px; font-size: 13px; color: #aaa;}
        input[type="file"] { background: none; border: 1px dashed #555; padding: 8px; width: 100%; cursor: pointer; color: #888; }

        #login-screen { display: block; }
        #main-app { display: none; }
        #tab-btn-admin { display: none; }
    </style>
</head>
<body>
    <div class="container">
        
        <div id="login-screen">
            <h2>ĐĂNG NHẬP</h2>
            <input type="password" id="password" onkeypress="if(event.key==='Enter') login()" placeholder="Mật khẩu...">
            <button class="btn-green" onclick="login()">ĐĂNG NHẬP</button>
        </div>

        <div id="main-app">
            <h2>ZALO WEB TOOL</h2>
            <div style="text-align:center; font-size:12px; color:#888; margin-bottom:10px;">Quyền: <b id="my-role" style="color:#00e676;"></b></div>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('tab-text', this)">TREO TEXT</button>
                <button class="tab-btn" onclick="switchTab('tab-tag', this)">RÉO TAG</button>
                <button class="tab-btn" onclick="switchTab('tab-admin', this)" id="tab-btn-admin" style="color:#ff5252;">QUẢN LÝ</button>
            </div>

            <div id="tool-area">
                <textarea id="cookie" rows="3" placeholder='Cookie Zalo (JSON)...'></textarea>
                <button class="btn-blue" onclick="getBoxList()">LẤY NHÓM</button>
                <div id="box-list" style="display:none; max-height:100px; overflow-y:auto; background:#0a0a0a; border:1px solid #333; margin-bottom:10px; padding:5px;"></div>
                <input type="text" id="box_id" placeholder="ID Nhóm...">

                <div id="tab-text" class="tab-content active">
                    <label>Nội dung (Có thể xuống dòng):</label>
                    <div class="file-upload-wrapper">
                        Hoặc tải lên file .txt: <input type="file" id="file_text" accept=".txt" onchange="loadFileToTextarea('file_text', 'msg_text')">
                    </div>
                    <textarea id="msg_text" rows="4" placeholder="Nội dung..."></textarea>
                    <input type="number" id="delay_text" value="10" placeholder="Delay (giây)">
                    <button class="btn-green" onclick="startTool('text')">CHẠY TEXT</button>
                </div>
                
                <div id="tab-tag" class="tab-content">
                    <button class="btn-blue" onclick="getMembers()">LẤY THÀNH VIÊN</button>
                    <div id="member-list" style="display:none; max-height:100px; overflow-y:auto; background:#0a0a0a; border:1px solid #333; margin-bottom:10px; padding:5px;"></div>
                    
                    <label>Nội dung (Có thể xuống dòng):</label>
                    <div class="file-upload-wrapper">
                        Hoặc tải lên file .txt: <input type="file" id="file_tag" accept=".txt" onchange="loadFileToTextarea('file_tag', 'msg_tag')">
                    </div>
                    <textarea id="msg_tag" rows="4" placeholder="Nội dung réo..."></textarea>
                    <input type="number" id="delay_tag" value="10" placeholder="Delay (giây)">
                    <button class="btn-green" onclick="startTool('tag')">CHẠY RÉO</button>
                </div>
            </div>

            <div id="tab-admin" class="tab-content">
                <button class="btn-blue" onclick="loadAdminSessions()">TẢI LẠI DANH SÁCH</button>
                <div id="admin-sessions" style="margin-top:15px;"></div>
            </div>

            <button class="btn-red" id="btn-stop" onclick="stopTool()" style="display:none;">DỪNG TOOL CỦA BẠN</button>
        </div>
    </div>

    <script>
        const API_URL = window.location.protocol + "//" + window.location.host + "/api";
        let current_task_id = null;
        let selected_members = [];
        let my_role = "dân thường";

        window.onload = async function() {
            const res = await fetch(`${API_URL}/check_auth`);
            const data = await res.json();
            if(data.authenticated) {
                my_role = data.role;
                setupUI();
            }
        };

        function setupUI() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('my-role').innerText = my_role;
            
            if (my_role === 'King' || my_role === 'lính của King') {
                document.getElementById('tab-btn-admin').style.display = 'block';
            } else {
                document.getElementById('tab-btn-admin').style.display = 'none';
            }
        }

        async function login() {
            const res = await fetch(`${API_URL}/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ password: document.getElementById('password').value })});
            const data = await res.json();
            if(data.success) {
                my_role = data.role;
                setupUI();
            } else { alert(data.msg); }
        }

        function loadFileToTextarea(inputId, textareaId) {
            const fileInput = document.getElementById(inputId);
            const textarea = document.getElementById(textareaId);
            const file = fileInput.files[0];
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    textarea.value = e.target.result;
                };
                reader.onerror = function() {
                    alert("Lỗi khi đọc file!");
                };
                reader.readAsText(file, 'UTF-8');
            }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            
            if (tabId === 'tab-admin') {
                document.getElementById('tool-area').style.display = 'none';
            } else {
                document.getElementById('tool-area').style.display = 'block';
            }

            if (tabId === 'tab-admin') loadAdminSessions();
        }

        async function loadAdminSessions() {
            const res = await fetch(`${API_URL}/admin/sessions`);
            const data = await res.json();
            const container = document.getElementById('admin-sessions');
            container.innerHTML = '';
            
            if (!data.success) {
                container.innerHTML = `<p style="color:red; text-align:center;">${data.msg}</p>`;
                return;
            }

            if (data.sessions.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">Không có ai đang chạy tool.</p>';
                return;
            }

            data.sessions.forEach(s => {
                const div = document.createElement('div');
                div.className = 'session-box';
                
                let showKill = false;
                if (data.my_role === 'King') showKill = true;
                if (data.my_role === 'lính của King' && s.role === 'dân thường') showKill = true;

                div.innerHTML = `
                    <div>IP: <span class="session-ip">${s.ip}</span></div>
                    <div>Quyền: <span class="session-role">${s.role}</span></div>
                    <div>Bắt đầu: ${s.time} | Trạng thái: <b style="color:${s.status==='running'?'#00e676':'#ff5252'}">${s.status.toUpperCase()}</b></div>
                    ${s.status === 'running' && showKill ? `<button class="btn-kill" onclick="killSession('${s.task_id}')">DỪNG PHIÊN NÀY</button>` : ''}
                `;
                container.appendChild(div);
            });
        }

        async function killSession(taskId) {
            if(!confirm("Dừng phiên này?")) return;
            const res = await fetch(`${API_URL}/admin/kill`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ task_id: taskId })});
            const data = await res.json();
            alert(data.msg);
            loadAdminSessions();
        }

        async function startTool(mode) {
            const cookie = document.getElementById('cookie').value.trim();
            const box_id = document.getElementById('box_id').value.trim();
            
            let message, delay, tag_ids = [], tag_names = [];
            
            if (mode === 'text') {
                message = document.getElementById('msg_text').value.replace(/\r?\n/g, '\\n');
                delay = document.getElementById('delay_text').value.trim();
            } else {
                if (selected_members.length === 0) return alert("Chưa chọn người để tag!");
                message = document.getElementById('msg_tag').value.replace(/\r?\n/g, '\\n');
                delay = document.getElementById('delay_tag').value.trim();
                tag_ids = selected_members.map(x => x.id);
                tag_names = selected_members.map(x => x.name);
            }

            if (!cookie || !box_id || !message) return alert("Nhập đủ thông tin!");

            const res = await fetch(`${API_URL}/start`, { 
                method: 'POST', headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ cookie, box_id, message, delay, mode, tag_ids, tag_names }) 
            });
            const data = await res.json();
            if(data.success) {
                current_task_id = data.task_id;
                document.getElementById('status').innerText = "✅ Đang chạy ngầm...";
                document.getElementById('btn-stop').style.display = 'block';
            } else { alert(data.msg); }
        }

        async function stopTool() {
            if (!current_task_id) return;
            const res = await fetch(`${API_URL}/stop`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ task_id: current_task_id })});
            const data = await res.json();
            document.getElementById('status').innerText = "🛑 " + data.msg;
            current_task_id = null;
            document.getElementById('btn-stop').style.display = 'none';
        }

        async function getBoxList() {
            const cookie = document.getElementById('cookie').value.trim();
            if (!cookie) return alert("Nhập Cookie trước!");
            const res = await fetch(`${API_URL}/get_box`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ cookie })});
            const data = await res.json();
            if(data.success) {
                const listDiv = document.getElementById('box-list');
                listDiv.innerHTML = '';
                data.threads.forEach(t => {
                    const item = document.createElement('div');
                    item.style.padding = '5px';
                    item.style.cursor = 'pointer';
                    item.innerHTML = `<span>${t.name}</span> <span style="color:#888; float:right;">${t.id}</span>`;
                    item.onclick = () => { document.getElementById('box_id').value = t.id; listDiv.style.display = 'none'; };
                    listDiv.appendChild(item);
                });
                listDiv.style.display = 'block';
            } else { alert(data.msg); }
        }

        async function getMembers() {
            const cookie = document.getElementById('cookie').value.trim();
            const group_id = document.getElementById('box_id').value.trim();
            if (!cookie || !group_id) return alert("Nhập Cookie và ID Nhóm trước!");
            const res = await fetch(`${API_URL}/get_members`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ cookie, group_id })});
            const data = await res.json();
            if(data.success) {
                const listDiv = document.getElementById('member-list');
                listDiv.innerHTML = '';
                selected_members = [];
                data.members.forEach(m => {
                    const item = document.createElement('label');
                    item.style.display = 'block'; item.style.padding = '5px';
                    item.innerHTML = `<input type="checkbox" value="${m.id}" data-name="${m.name}"> ${m.name}`;
                    item.querySelector('input').onchange = (e) => {
                        if(e.target.checked) selected_members.push({id: m.id, name: m.name});
                        else selected_members = selected_members.filter(x => x.id !== m.id);
                    };
                    listDiv.appendChild(item);
                });
                listDiv.style.display = 'block';
            } else { alert(data.msg); }
        }
    </script>
</body>
</html>
